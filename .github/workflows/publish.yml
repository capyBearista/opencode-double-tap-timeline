name: Publish to NPM

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          OLD_VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          if [ "$OLD_VERSION" != "$VERSION" ]; then
            npm version "$VERSION" --no-git-tag-version
            echo "synced=true" >> $GITHUB_OUTPUT
          else
            echo "synced=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if version is already published
        id: check_version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=${{ steps.version.outputs.VERSION }}
          PUBLISHED_VERSION=$(npm view $PACKAGE_NAME@$PACKAGE_VERSION version 2>/dev/null || echo "")
          if [ "$PUBLISHED_VERSION" = "$PACKAGE_VERSION" ]; then
            echo "Version $PACKAGE_VERSION is already published to npm. Skipping."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Version $PACKAGE_VERSION is not yet published. Proceeding."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Wait before publishing
        run: sleep 300

      - name: Publish to npm
        if: steps.check_version.outputs.exists != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump back to repo
        if: steps.check_version.outputs.exists != 'true' && steps.version.outputs.synced == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lockb || true
          git commit -m "chore(release): sync package version to ${{ steps.version.outputs.VERSION }}" || true
          git push origin HEAD:main
